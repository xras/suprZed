name: Report a bug
description: Report a bug in suprZed.
body:
  - type: markdown
    attributes:
      value: |
        Please check this repository's existing issues first.
        Remove tokens, passwords, private paths and conversation content before posting.
        This is a personal fork. There is no commitment to provide support.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Explain how to reproduce the problem in suprZed.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behaviour
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: |
        Include the version from About and your operating system.
        Use "zed: copy system specs into clipboard" in the command palette to copy system details.
        Include the agent and its version for terminal problems.
        Remove private information before posting.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: |
        Use "zed: open log" in the command palette to find the editor log.
        Remove tokens, passwords, private paths and conversation content before posting.
