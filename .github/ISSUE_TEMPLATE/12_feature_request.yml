name: Suggest a feature
description: Suggest an improvement to suprZed.
body:
  - type: markdown
    attributes:
      value: |
        Please check this repository's existing issues first.
        A suggestion does not guarantee that a feature will be added.
        External pull requests are not accepted initially.
  - type: textarea
    id: task
    attributes:
      label: What task would this help with?
      description: Describe the problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Explain how the change would help.
    validations:
      required: true
